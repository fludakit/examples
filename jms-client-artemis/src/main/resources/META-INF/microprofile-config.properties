# Artemis section - the config module builds the connection factory from it.
fluda.jms.artemis.broker-url=${JMS_BROKER_URL:tcp://localhost:61616}
fluda.jms.artemis.username=${JMS_USERNAME:artemis}
fluda.jms.artemis.password=${JMS_PASSWORD:artemis}

# Used by client.destination() in OrderService.
fluda.jms.default-destination=orders
