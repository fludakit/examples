# Databases for running the examples locally.
#
# Mirrors the service containers declared in .github/workflows/examples.yml so the
# examples can be run against the same database/user/password as CI.
#
#   docker compose -f examples/docker-compose.yml up -d
#
#   - MariaDB  : localhost:3306  (root/root, database "servlet")   -> examples/servlet
#   - PostgreSQL: localhost:5432 (testuser/testpassword, db "testdb") -> examples/jakartaee

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: servlet
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "testuser" ]
      interval: 10s
      timeout: 5s
      retries: 5
