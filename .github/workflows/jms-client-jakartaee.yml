name: JMS Client Jakarta EE Example

on:
  push:
    branches: [ main ]
    paths:
      - 'jms-client-jakartaee/**'
      - '.github/workflows/jms-client-jakartaee.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'jms-client-jakartaee/**'
      - '.github/workflows/jms-client-jakartaee.yml'
  workflow_dispatch:

jobs:
  glassfish:
    name: Jakarta EE (GlassFish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      # unpacks GlassFish and starts it through Arquillian (managed container)
      - name: Run GlassFish integration tests
        run: mvn -B -ntp -pl jms-client-jakartaee -Parq-glassfish-managed verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wildfly:
    name: Jakarta EE (WildFly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      # unpacks WildFly and starts it through Arquillian (managed container)
      - name: Run WildFly integration tests
        run: mvn -B -ntp -pl jms-client-jakartaee -Parq-wildfly-managed verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
