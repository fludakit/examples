name: Vanilla Example

on:
  push:
    branches: [ main ]
    paths:
      - 'vanilla/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'vanilla/**'
  workflow_dispatch:

jobs:
  build:
    name: Vanilla (core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      - name: Build vanilla example
        run: mvn -B -ntp -pl vanilla verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
