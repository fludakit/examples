name: Data Example

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  build:
    name: Data (annotation-driven repositories, Weld SE + H2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      - name: Build data example
        run: mvn -B -ntp -pl data verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
