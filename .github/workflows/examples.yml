name: Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  vanilla:
    name: Vanilla (core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Checkout jdbc-client
        uses: actions/checkout@v7
        with:
          repository: fludakit/jdbc-client
          path: jdbc-client
      - name: Install jdbc-client
        run: mvn -B -ntp -s .github/settings.xml -f jdbc-client/pom.xml install -DskipTests
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Build vanilla example
        run: mvn -B -ntp -s .github/settings.xml -pl vanilla verify
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  javase:
    name: Java SE (core + CDI, Weld SE)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Checkout jdbc-client
        uses: actions/checkout@v7
        with:
          repository: fludakit/jdbc-client
          path: jdbc-client
      - name: Install jdbc-client
        run: mvn -B -ntp -s .github/settings.xml -f jdbc-client/pom.xml install -DskipTests
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Build javase example
        run: mvn -B -ntp -s .github/settings.xml -pl javase verify
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  servlet:
    name: Servlet (Tomcat 11 + MariaDB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: servlet
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Checkout jdbc-client
        uses: actions/checkout@v7
        with:
          repository: fludakit/jdbc-client
          path: jdbc-client
      - name: Install jdbc-client
        run: mvn -B -ntp -s .github/settings.xml -f jdbc-client/pom.xml install -DskipTests
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Run servlet ITs on embedded Tomcat
        run: mvn -B -ntp -s .github/settings.xml -pl servlet -Parq-tomcat-embedded verify
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  jakartaee-glassfish:
    name: Jakarta EE (GlassFish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Checkout jdbc-client
        uses: actions/checkout@v7
        with:
          repository: fludakit/jdbc-client
          path: jdbc-client
      - name: Install jdbc-client
        run: mvn -B -ntp -s .github/settings.xml -f jdbc-client/pom.xml install -DskipTests
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Run GlassFish integration tests
        run: mvn -B -ntp -s .github/settings.xml -pl jakartaee -Parq-glassfish-managed verify
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  jakartaee-wildfly:
    name: Jakarta EE (WildFly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Checkout jdbc-client
        uses: actions/checkout@v7
        with:
          repository: fludakit/jdbc-client
          path: jdbc-client
      - name: Install jdbc-client
        run: mvn -B -ntp -s .github/settings.xml -f jdbc-client/pom.xml install -DskipTests
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Run WildFly integration tests
        run: mvn -B -ntp -s .github/settings.xml -pl jakartaee -Parq-wildfly-managed verify
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
