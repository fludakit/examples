name: Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  vanilla:
    name: Vanilla (core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      - name: Build vanilla example
        run: mvn -B -ntp -pl vanilla verify
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}

  javase:
    name: Java SE (core + CDI, Weld SE)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"

      - name: Build javase example
        run: mvn -B -ntp -pl javase verify
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}

  servlet:
    name: Servlet (Tomcat 11 + MariaDB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: servlet
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      - name: Run servlet ITs on embedded Tomcat
        run: mvn -B -ntp -pl servlet -Parq-tomcat-embedded verify
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}

  jakartaee-glassfish:
    name: Jakarta EE (GlassFish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      - name: Run GlassFish integration tests
        run: mvn -B -ntp -pl jakartaee -Parq-glassfish-managed verify
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}

  jakartaee-wildfly:
    name: Jakarta EE (WildFly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"
      - name: Run WildFly integration tests
        run: mvn -B -ntp -pl jakartaee -Parq-wildfly-managed verify
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}
