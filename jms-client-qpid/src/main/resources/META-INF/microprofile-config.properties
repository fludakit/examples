# Qpid section - the config module builds the AMQP 1.0 connection factory from it.
fluda.jms.qpid.remote-url=${JMS_BROKER_URL:amqp://localhost:5672}
fluda.jms.qpid.username=${JMS_USERNAME:artemis}
fluda.jms.qpid.password=${JMS_PASSWORD:artemis}

# Used by client.destination() in OrderService.
fluda.jms.default-destination=orders
